name: Update profile card

on:
  push:
    branches: [main]
    paths-ignore: ["assets/**", "cache/**"]
  schedule:
    - cron: "0 3 * * *"      # every day at 03:00 UTC
  workflow_dispatch:          # button "Run workflow"

permissions:
  contents: write

concurrency:
  group: profile-card
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Generate card
        run: python generate.py
        env:
          # ACCESS_TOKEN (optional) for private repositories.
          # Without it, GITHUB_TOKEN is the default (only public data).
          GH_TOKEN: ${{ secrets.ACCESS_TOKEN || secrets.GITHUB_TOKEN }}

      # Runs even if the generation crashes: Store a partial cache for the next execution
      - name: Commit
        if: ${{ !cancelled() }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets cache
          if git diff --cached --quiet; then
            echo "Without changes"
          else
            git commit -m "chore: Update profile"
            git push
          fi
